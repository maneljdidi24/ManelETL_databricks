name: Deploy PySpark to Databricks

on:
  push:
    branches:
      - main   # déclenchement sur la branche principale

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest || echo "No tests found"

      - name: Build Docker image
        run: docker build -t manel-etl-pyspark .

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker image
        run: docker tag manel-etl-pyspark manel-etl/manel-etl-pyspark:latest
      - run: docker push manel-etl/manel-etl-pyspark:latest

      - name: Configure Databricks CLI
        run: |
          mkdir -p ~/.databrickscfg
          echo "[DEFAULT]" > ~/.databrickscfg
          echo "host = https://dbc-1397ac4c-6488.cloud.databricks.com" >> ~/.databrickscfg
          echo "token = ${{ secrets.tmanel }}" >> ~/.databrickscfg

      - name: Deploy to Databricks Workspace
        run: |
          databricks workspace mkdirs /Repos/jdidimanel1987@gmail.com/etl-pyspark
          databricks workspace import -o app.py /Repos/jdidimanel1987@gmail.com/etl-pyspark/app.py
