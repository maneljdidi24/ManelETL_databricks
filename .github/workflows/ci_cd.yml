name: CI/CD PySpark ETL

on:
  push:
    branches: [ main, dev ]
  pull_request:

jobs:
  # ---------------- CI ----------------
  ci:
    name: CI - Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run PySpark job
        run: python app.py

      - name: Run tests
        run: pytest || echo "No tests found"

  # ---------------- CD ----------------
  cd:
    name: CD - Docker & Databricks
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- Docker ---
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/manel-etl-pyspark:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/manel-etl-pyspark:latest

      # --- Databricks ---
      - name: Install Databricks CLI
        run: pip install databricks-cli

      - name: Deploy to Databricks Workspac
